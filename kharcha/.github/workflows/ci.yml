name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kharcha
          POSTGRES_PASSWORD: kharcha
          POSTGRES_DB: kharcha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kharcha" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://kharcha:kharcha@localhost:5432/kharcha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Backend — install, type-check, test
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Frontend — install, build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Docker image builds
        run: docker build -t kharcha .
